<style>
/* VOICE occasion: the clan's own game hub, bright and chunky like a strategy-game menu

   COLOUR sky blue over grass green, parchment panels, wood brown frames; gold for #1 and stars, red for penalties; night version for dark

:root{color-scheme:light dark;--k:#2a1608;--sky1:light-dark(#46aef0,#0e1730);--sky2:light-dark(#bfe9ff,#2c406f);--sun:light-dark(#fff4a3,#f3efd2);--cloud:light-dark(#ffffff,#3b4f7d);--hill1:light-dark(#a6dc6c,#2c5232);--hill2:light-dark(#7cc544,#22452a);--grass:light-dark(#5fae31,#1c3a1d);--grass2:light-dark(#529c29,#173118);--parch:light-dark(#fcf3da,#3a2a1c);--parch2:light-dark(#f2e1b4,#31231a);--edge:light-dark(#7a4a1d,#0f0905);--ink:light-dark(#3b250f,#f5e8cc);--mut:light-dark(#7b5a35,#cdb68e);--wood:light-dark(#b06a2c,#6a4019);--woodk:light-dark(#6e3d14,#3a2210);--gold:#ffd13b;--goldk:#c78700;--red:light-dark(#d8372a,#ff6a55);--green:#6cc236;--greenk:#2f6512}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

.wcell{gap:4px}.wrow{display:flex;align-items:center;gap:4px;border-radius:8px;padding:1px 2px}.wrow .esel{min-width:0;flex:1}.wrow .wchk,.wchk input{flex:none}.anum{font:13px/1 'Lilita One',sans-serif;color:var(--mut);width:10px;text-align:center}

}
function gear(r,t,h,cx=0,cy=0){let d="";for(let i=0;i<t;i++){const a=i/t*2*Math.PI,w=Math.PI/t,ri=r*.82;[[a-w*.6,ri],[a-w*.38,r],[a+w*.38,r],[a+w*.6,ri]].forEach((q,j)=>d+=(i+j?"L":"M")+(cx+q[1]*Math.cos(q[0])).toFixed(1)+" "+(cy+q[1]*Math.sin(q[0])).toFixed(1))}d+="Z";const k=r*h;return d+`M${cx+k} ${cy}A${k} ${k} 0 1 0 ${cx-k} ${cy}A${k} ${k} 0 1 0 ${cx+k} ${cy}Z`}

function applyManual(src){

  const each=(o,f)=>Object.entries(o||{}).forEach(([k,v])=>{const p=k.split(MK);f(p,v)});
  each(m.cwl,(p,v)=>{if(p[0]!=d.cwl.season)return;const dy=d.cwl.days.find(x=>x.label==p[1]);if(!dy)return;if(v==null)delete dy.e[p[2]];else dy.e[p[2]]=v});
  (m.cols?.war||[]).forEach(c=>{if(!d.wars.some(w=>(w.id||w.label)==c.id))d.wars.push({id:c.id,label:c.label,atk:{},manual:true})});
  (m.cols?.cap||[]).forEach(c=>{if(!d.capital.some(x=>(x.id||x.label)==c.id))d.capital.push({id:c.id,label:c.label,att:{},manual:true})});
  Object.entries(m.lbl?.war||{}).forEach(([id,l])=>{const w=d.wars.find(x=>(x.id||x.label)==id);if(w&&l)w.label=l});
  Object.entries(m.lbl?.cap||{}).forEach(([id,l])=>{const c=d.capital.find(x=>(x.id||x.label)==id);if(c&&l)c.label=l});
  Object.entries(m.don||{}).forEach(([n,v])=>{const p=d.players.find(x=>x.name==n);if(p&&v!=null)p.donations=v});
  each(m.war,(p,v)=>{const w=d.wars.find(x=>(x.id||x.label)==p[0]);if(!w)return;w.pts??={};if(v==null)delete w.pts[p[1]];else w.pts[p[1]]=v});
  each(m.watk,(p,v)=>{const w=d.wars.find(x=>(x.id||x.label)==p[0]);if(!w)return;w.atk??={};const a=w.atk[p[1]]=[...(w.atk[p[1]]||[])];while(a.length<2)a.push(null);a[+p[2]]=v;if(a.every(z=>z==null))delete w.atk[p[1]];if(w.pts)delete w.pts[p[1]];if(w.miss)delete w.miss[p[1]]});
  each(m.cap,(p,v)=>{const c=d.capital.find(x=>(x.id||x.label)==p[0]);if(!c)return;if(v==null)delete c.att[p[1]];else c.att[p[1]]=v});
  each(m.games,(p,v)=>{const g=d.games.find(x=>(x.id||x.label)==p[0]);if(!g)return;if(v==null)delete g.pts[p[1]];else g.pts[p[1]]=v});
  return d;
}

<div class="panel" style="margin-top:20px"><div class="ptitle lil o1">Area capi</div>${ADMIN?`<p style="margin-top:0">Le modifiche fatte dagli admin restano nel browser in cui le hai fatte. Per pubblicarle a tutti copia i dati e caricali nel repository come <code>data/clan.json</code>: la sincronizzazione API conserva le modifiche manuali e le ammonizioni.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="gold" id="cp">Copia dati JSON</button><button class="ghost" id="rs">Ripristina dati pubblicati</button></div><p class="note">${pendingCount()?`Hai ${pendingCount()} modifiche non ancora confermate: confermale o annullale dalla barra admin nelle pagine.`:LOCAL?`Modifiche confermate in questo browser: ${Object.values(D.manual||{}).reduce((a,o)=>a+Object.keys(o||{}).length,0)} valori. Copia i dati per pubblicarle a tutti.`:"Nessuna modifica locale."}</p>`:`<p style="margin-top:0">Modificare i numeri, assegnare ammonizioni e pubblicare i dati è riservato agli admin.</p><button class="gold" type="button" data-login>Login admin</button>`}</div></div></section>`;
/* ---------- router ---------- */
function render(){
  const id=(location.hash||"#home").slice(1),k=P[id]?id:"home";
  document.documentElement.classList.toggle("admin",ADMIN);
  const adm=$("#adm");adm.textContent=ADMIN?"Esci":"Login admin";adm.className=ADMIN?"admbtn ghost":"admbtn gold";adm.title=ADMIN?"Sei collegato come admin: clicca per uscire":"Accesso riservato agli admin";
  PAGE=k;VIEWNOW=!D.prev||["home","giocatori","dati"].includes(k)?"cur":CWLP(k)?"prev":VIEW;CUR=D;
  const KEEP=D;RAWD=VIEWNOW=="prev"?KEEP.prev.data:KEEP;D=applyManual(RAWD);if(RAWD!==KEEP){D.meta={...KEEP.meta,don:RAWD.don||null};const tg=new Set(D.players.map(p=>p.tag));KEEP.players.filter(p=>!p.ex&&p.tag&&!tg.has(p.tag)).forEach(p=>D.players.push({...p,donations:null}))}
  try{const S=score();
    $("#nav").innerHTML=NAV.map(([h,l])=>`<a href="#${h}" class="${h==k?"on":""}" ${h==k?'aria-current="page"':""}>${l}</a>`).join("");
    $("#app").innerHTML=P[k](S);
    $("#src").textContent=`${D.meta.test?"DATI DI PROVA: "+D.meta.clan+" · ":""}Punteggi: ${D.meta.source=="api"?"API Clash of Clans":"foglio del clan"} · Membri: ${D.meta.source=="api"?"API ufficiale":ROSTER?.src=="live"?"API, letti ora":"API, lettura del "+LIVE0.at}${LOCAL?" · modifiche locali":""}`;
  }finally{D=KEEP}
  bind(k);const on=document.querySelector("nav a.on");if(on){const nv=on.parentNode;nv.scrollLeft=Math.max(0,on.offsetLeft-nv.offsetLeft-(nv.clientWidth-on.offsetWidth)/2)}
}
function save(){LOCAL=true;try{localStorage.setItem("mech-data",JSON.stringify(D))}catch(e){}render()}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
function edit(fn){const T=VIEWNOW=="prev"&&D.prev?D.prev.data:D;T.manual??={};fn(T.manual);save()}
function setBase(){BASE=snap();BASEO=JSON.parse(BASE);try{localStorage.setItem("mech-base",JSON.stringify({u:D.meta.updated,s:BASE}))}catch(e){}}
function confirmEdits(){const n=pendingCount();setBase();save();toast(n==1?"1 modifica confermata":n+" modifiche confermate")}
function cancelEdits(){const n=pendingCount(),o=JSON.parse(BASE||'{"manual":{},"warnings":[]}');D.manual=o.manual;D.warnings=o.warnings;if(D.prev){D.prev.data.manual=o.pm||{};D.prev.cwlClosed=o.cc??null}save();toast(n==1?"1 modifica annullata":n+" modifiche annullate")}
function curWar(k){const [id,nm]=k.split(MK);return applyManual(D).wars.find(w=>(w.id||w.label)==id)?.atk?.[nm]}
function curCwl(k){const [se,l,nm]=k.split(MK),V=applyManual(VIEWNOW=="prev"&&D.prev?D.prev.data:D);return V.cwl.days.find(d=>d.label==l)?.e[nm]}
function onEdit(el){
  const t=el.dataset.e,k=el.dataset.k,v=el.value.trim(),txt=["cday","wlbl","clbl","cwrong","wst","wth","wna"].includes(t),num=v===""||txt?null:Number(v.replace(",","."));
  if(num!=null&&!isFinite(num)){toast("Numero non valido");return}
  if(t=="warn"){const [nm,ti]=k.split(MK),ty=+ti,n=Math.min(9,Math.max(0,Math.round(num||0))),mine=D.warnings.filter(w=>w.name==nm&&w.type==ty);if(n===mine.length){render();return}
    const keep=mine.slice(0,n),add=[...Array(Math.max(0,n-keep.length))].map(()=>({name:nm,type:ty,note:"",date:new Date().toISOString().slice(0,10)}));
    D.warnings=[...D.warnings.filter(w=>!(w.name==nm&&w.type==ty)),...keep,...add];save();return}
  edit(m=>{
    if(t=="cwlp"){m.cwlOv??={};const o=m.cwlOv[k]??={};o.p=num==null?null:Math.round(Math.max(0,num));delete o.m;if(o.p==null)delete m.cwlOv[k]}
    else if(t=="wst"||t=="wth"||t=="wna"){const q=k.split(MK),i=+q.pop(),kk=q.join(MK),nm=q[1],a=[...(curWar(kk)||[])];while(a.length<2)a.push(null);const x=a[i],isS=!!x&&x.s!=null;m.watk??={};
      if(t=="wst"){if(v==="")a[i]=null;else if(v=="miss")a[i]={st:"miss"};else{a[i]={s:+v,eth:isS?x.eth:(D.players.find(p=>p.name==nm)?.th||15)};if(isS&&x.na)a[i].na=true}}
      else if(t=="wth"){if(isS)a[i]={...x,eth:+v}}
      else if(isS){a[i]={...x};if(el.checked)a[i].na=true;else delete a[i].na}
      m.watk[kk+MK+i]=a[i]}
    else if(t=="war"){m.war??={};m.war[k]=num==null?null:Math.min(9,Math.max(0,num))}
    else if(t=="cap"){m.cap??={};m.cap[k]=num==null?null:Math.min(6,Math.max(0,Math.round(num)))}
    else if(t=="wlbl"||t=="clbl"){const ty=t=="wlbl"?"war":"cap";m.lbl??={};m.lbl[ty]??={};if(v)m.lbl[ty][k]=v.slice(0,20);else delete m.lbl[ty][k]}
    else if(t=="don"){m.don??={};if(num==null)delete m.don[k];else m.don[k]=Math.max(0,Math.round(num))}
    else if(t=="games"){m.games??={};m.games[k]=num==null?null:Math.min(4000,Math.max(0,Math.round(num)))}
    else if(t=="cday"){m.cwl??={};const cur=curCwl(k),nm=k.split(MK)[2];
      if(v==="")m.cwl[k]=null;else if(["miss","red","exc"].includes(v))m.cwl[k]={st:v};
      else m.cwl[k]={st:cur?.st=="wrong"?"wrong":"ok",s:+v,p:cur?.p??0,eth:cur?.eth??((VIEWNOW=="prev"&&D.prev?D.prev.data:D).players.find(p=>p.name==nm)?.th||15)}}
    else if(t=="cwrong"){m.cwl??={};const cur=curCwl(k);if(cur&&cur.s!=null)m.cwl[k]={...cur,st:el.checked?"wrong":"ok"}}
    else if(t=="cth"){m.cwl??={};const cur=curCwl(k);if(cur&&cur.s!=null)m.cwl[k]={...cur,eth:+v}}
  });
}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function openLogin(){const m=$("#lm");m.hidden=false;$("#lgU").value="";$("#lgP").value="";$("#lgE").textContent="";setTimeout(()=>$("#lgU").focus(),30)}
function closeLogin(){$("#lm").hidden=true;$("#adm").focus()}
function logout(){ADMIN=false;try{sessionStorage.removeItem("mech-admin")}catch(e){}render();toast("Sei uscito dalla modalità admin")}
function bind(k){
  document.querySelectorAll("th[data-k]").forEach(h=>h.onclick=()=>{const id=h.closest("table").dataset.id,cur=SORT[id];SORT[id]={k:h.dataset.k,d:cur&&cur.k==h.dataset.k?-cur.d:-1};render()});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.view;render()});
  document.querySelectorAll("[data-closecwl]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){D.prev.cwlClosed={at:new Date().toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})};save();toast("CWL chiusa: premi Conferma per renderla definitiva")}else{b.dataset.armed="1";b.textContent="Conferma chiusura";clearTimeout(b._t);b._t=setTimeout(()=>{delete b.dataset.armed;b.textContent="Chiudi CWL"},5000)}});
  document.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=()=>{D.prev.cwlClosed=null;save();toast("CWL riaperta: premi Conferma per salvare")});
  document.querySelectorAll("[data-addcol]").forEach(b=>b.onclick=()=>{const t=b.dataset.addcol,id="m"+Date.now(),dm=new Date().toLocaleDateString("it-IT",{timeZone:"Europe/Rome",day:"2-digit",month:"2-digit"});edit(m=>{m.cols??={};(m.cols[t]??=[]).push({id,label:dm})});toast("Colonna aggiunta: premi Conferma per salvarla")});
  document.querySelectorAll("[data-delcol]").forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.delcol.split(MK);edit(m=>{m.cols[t]=(m.cols[t]||[]).filter(c=>c.id!=id);Object.keys(m[t]||{}).forEach(k=>{if(k.split(MK)[0]==id)delete m[t][k]});if(m.lbl?.[t])delete m.lbl[t][id]})});
  document.querySelectorAll("[data-login]").forEach(b=>b.onclick=openLogin);
  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=cancelEdits);
  document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=confirmEdits);
  if(ADMIN)document.querySelectorAll("[data-e]").forEach(el=>{el.onchange=()=>setTimeout(()=>{const nx=document.activeElement?.id;onEdit(el);const f=nx&&document.getElementById(nx);if(f)f.focus()},0);if(el.tagName=="INPUT")el.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();el.blur()}}});
  if(k=="cwl"){const u=()=>{const my=+$("#cMy").value,en=+$("#cEn").value,s=+$("#cSt").value,anf=s<0,na=!anf&&$("#cNa").checked,pc=anf?0:Math.max(0,Math.min(100,+$("#cPc").value||0)),m=R.mult(en-my),x=anf?0:s*m,ps=x*R.cwlX+(na?R.naPts:0),tot=anf?R.missed:ps+pc/R.pctDiv;
    $("#cNa").disabled=anf;$("#cPc").disabled=anf;
    $("#cStars").innerHTML=`<span class="stars" style="transform:scale(2.2);transform-origin:left center;display:inline-flex;width:110px">${[0,1,2].map(i=>ic(i<s?"star":"star0")).join("")}</span>`;$("#cRes").innerHTML=sg2(tot)+" pt";
    const ms=String(m).replace(".",",");
    $("#cWar").textContent=anf?`Attacco non fatto: −10 sul totale C.W.L. In War non toglie punti stella ma vale un'ammonizione (−10).`:`Punti stella: ${s} × ${ms} × 10 = ${f2(x*R.cwlX)}${na?", meno 10 per il nemico non assegnato = "+f2(ps):""}. Percentuale: ${pc} ÷ 35 = ${f2(pc/R.pctDiv)}. In War lo stesso attacco vale ${s} × ${ms} × 5 = ${f2(x*R.warX)} punti stella${na?", più un'ammonizione (−10)":""}.`};
  ["#cMy","#cEn","#cSt","#cPc","#cNa"].forEach(s=>{$(s).oninput=u;$(s).onchange=u});u()}
  if(k=="giocatori"&&$("#q"))$("#q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll(".pc").forEach(c=>c.hidden=!c.dataset.n.includes(q))};
  if(k=="dati"&&ADMIN){$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(D,null,1));toast("Dati copiati negli appunti")}catch(e){toast("Copia non riuscita in questo browser")}};$("#rs").onclick=()=>{try{localStorage.removeItem("mech-data");localStorage.removeItem("mech-base")}catch(e){}LOCAL=false;BASE=null;boot()}}
}
async function boot(){
  D=seed();ROSTER=null;
  try{const r=await fetch("data/clan.json",{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.players)D=j}}catch(e){}
  try{const l=localStorage.getItem("mech-data");if(l){const j=JSON.parse(l);if(j.meta&&j.meta.updated==D.meta.updated&&(j.meta.v||0)==(D.meta.v||0)){D=j;LOCAL=true}}}catch(e){}
  if(D.meta.source=="api"){ROSTER={src:"api",at:D.meta.updated,clan:{...(D.meta.info||LIVE0.clan),members:D.players.map(p=>({tag:p.tag,name:p.name,townHallLevel:p.th}))},moves:D.meta.moves||[]}}
  else applyRoster(LIVE0);
  BASE=null;try{const b=JSON.parse(localStorage.getItem("mech-base")||"null");if(LOCAL&&b&&b.u==D.meta.updated)BASE=b.s}catch(e){}
  if(!BASE)BASE=snap();BASEO=JSON.parse(BASE);
  applyDon(D.meta.source=="api"&&D.meta.don?D.meta.don:DON);
  render();
  if(D.meta.source!="api"){const lv=await liveRoster();if(lv){applyRoster(lv);applyDon(DON);render()}}
  if(D.meta.source!="api"){const dn=await liveDonations();if(dn){applyDon(dn);render()}} /* con la sincronizzazione vale il contatore ufficiale */
}
try{ADMIN=sessionStorage.getItem("mech-admin")=="1"}catch(e){}
$("#adm").onclick=()=>ADMIN?logout():openLogin();
$("#lgX").onclick=closeLogin;
$("#lm").onclick=e=>{if(e.target.id=="lm")closeLogin()};
addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("#lm").hidden)closeLogin()});
$("#lf").onsubmit=async e=>{e.preventDefault();const er=$("#lgE");
  if(!window.crypto?.subtle){er.textContent="Questo browser non permette l'accesso sicuro (serve una pagina https).";return}
  const h=await sha($("#lgU").value.trim()+":"+$("#lgP").value);
  if(h===AUTH){ADMIN=true;try{sessionStorage.setItem("mech-admin","1")}catch(x){}$("#lm").hidden=true;render();toast("Accesso admin effettuato")}
  else{er.textContent="Utente o password non corretti.";const f=$("#lf");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");$("#lgP").select()}};
document.getElementById("lgo").innerHTML=crest();
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
boot();
}
</script>
